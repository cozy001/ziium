<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f3"><title>한 해의 열매 카드 뽑기</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Gowun Dodum',sans-serif}body{margin:0;background:#f1f5f9}.app{height:min(840px,100vh);max-width:460px;margin:auto;background:linear-gradient(160deg,#ecfdf5,#fff1f2);overflow:hidden;position:relative}.gamja{font-family:'Gamja Flower',cursive}.gingham{background-color:#fff0f3;background-image:linear-gradient(90deg,#ffb6c166 50%,transparent 50%),linear-gradient(#ffb6c166 50%,transparent 50%);background-size:24px 24px}.screen{height:calc(100% - 64px);padding:20px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}.hidden{display:none!important}.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px) rotate(1deg)}}.shake{animation:shake .7s ease-in-out infinite}@keyframes shake{20%{transform:rotate(-4deg) scale(1.04)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg) scale(1.05)}80%{transform:rotate(3deg)}}.flip{transform:rotateY(180deg)}.preserve{transform-style:preserve-3d;transition:transform .7s}.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}.front{transform:rotateY(180deg)}button{cursor:pointer}.fruit{font-size:92px;filter:drop-shadow(0 8px 8px #0002)}.modal{position:absolute;inset:0;background:#0008;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:white;border-radius:28px;padding:24px;width:100%;max-width:350px}.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:white;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:30}.toast.show{opacity:1}
</style></head>
<body><main class="app shadow-2xl">
<header class="h-16 px-5 flex items-center justify-between"><b class="bg-white/80 px-3 py-2 rounded-full text-pink-500 gamja">🍎 한 해의 열매</b><div class="flex gap-2"><button id="sound" class="w-10 h-10 rounded-full bg-white/80 text-pink-400">🔊</button><button id="gallery" class="w-10 h-10 rounded-full bg-white/80 text-pink-400">▦</button></div></header>
<section id="home" class="screen"><div><span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">올해의 나를 돌아보는 질문</span><h1 class="text-2xl font-bold mt-3 leading-relaxed">지금,<br><em class="not-italic text-pink-500">당신의 한 해</em>가 담긴<br>열매 카드를 뽑아보세요!</h1><p class="text-pink-300">＼ ＼ ♥ ／ ／</p></div><div class="float"><div class="fruit">🍎🍇🍑🍊🍓</div><p class="text-emerald-600 font-bold">당신의 한 해를 담은 열매</p></div><div><button id="draw" class="w-full py-4 rounded-full bg-gradient-to-r from-rose-400 to-pink-500 text-white text-lg font-bold shadow-lg">카드 뽑기 💓</button><p class="text-xs text-pink-500 mt-3">한 해의 열매가 우리의 일상에 가득하길 ♥</p></div></section>
<section id="loading" class="screen hidden"><div><h2 class="gamja text-4xl text-pink-600">두근두근...</h2><p>지금, 열매 카드를 뽑고 있어요!</p></div><div class="flex justify-center"><div class="shake gingham border-8 border-white rounded-3xl w-60 h-88 p-4 shadow-xl"><div class="h-full border-2 border-dashed border-pink-300 rounded-2xl flex items-center justify-center text-4xl">♥</div></div></div><div class="h-2 bg-pink-100 rounded-full overflow-hidden"><div id="progress" class="h-full bg-pink-500 w-0 transition-all duration-[2300ms]"></div></div></section>
<section id="result" class="screen hidden"><div><span class="text-xs bg-pink-100 text-pink-500 px-3 py-1 rounded-full">올해 나에게 도착한 열매</span></div><div class="perspective flex justify-center"><div id="card" class="relative preserve w-72 h-[420px]"><div class="face absolute inset-0 gingham border-8 border-white rounded-3xl p-4 shadow-xl flex items-center justify-center"><div class="w-full h-full border-2 border-dashed border-pink-300 rounded-2xl flex items-center justify-center text-4xl">♥</div></div><div class="face front absolute inset-0 bg-white border-8 border-rose-200 rounded-3xl p-5 shadow-xl flex flex-col items-center justify-between"><h2 id="name" class="gamja text-3xl"></h2><div id="icon" class="fruit">🍎</div><b id="badge" class="px-5 py-2 rounded-full text-white"></b><p id="question" class="bg-rose-50 p-4 rounded-2xl text-sm leading-relaxed"></p><small class="text-pink-400">한 해의 5가지 열매</small></div></div></div><div class="grid grid-cols-2 gap-3"><button id="again" class="py-3 rounded-2xl bg-purple-100 text-purple-700 font-bold">↻ 다시 뽑기</button><button id="share" class="py-3 rounded-2xl bg-rose-500 text-white font-bold">공유 / 저장</button></div></section>
<section id="done" class="screen hidden"><div><h2 class="gamja text-4xl text-gray-800">다시 뽑고 싶다면<br>언제든지!</h2><p class="text-amber-400">＼ ＼ ♥ ／ ／</p></div><div class="text-6xl tracking-widest">🍎 🍇 🍑 🍊 🍓</div><p class="text-sm text-gray-600">다섯 가지 열매가 당신의 일상에<br>늘 함께하길 ♥</p><button id="homeBtn" class="w-full py-4 rounded-full bg-purple-400 text-white font-bold">⌂ 처음으로</button></section>
<div id="shareModal" class="modal hidden"><div class="modalbox text-center"><button class="float-right text-gray-400" data-close>✕</button><p class="text-emerald-600 text-sm">오늘의 한 해 열매 카드</p><div class="bg-pink-50 rounded-2xl p-4 my-4"><div id="micon" class="fruit text-6xl"></div><h3 id="mname" class="gamja text-2xl"></h3><b id="mbadge" class="px-3 py-1 rounded-full text-white text-xs"></b><p id="mquestion" class="text-xs mt-3"></p></div><button id="copy" class="w-full py-3 rounded-xl bg-pink-500 text-white font-bold">카드 내용 복사하기</button><button id="finish" class="w-full py-3 mt-2 rounded-xl bg-gray-100 font-bold">완료 화면으로 이동</button></div></div>
<div id="galleryModal" class="modal hidden"><div class="modalbox"><button class="float-right text-gray-400" data-close>✕</button><h3 class="font-bold text-lg text-pink-500">🍎 한 해의 열매 도감</h3><div id="list" class="space-y-2 my-4"></div><button class="w-full py-3 rounded-xl bg-pink-500 text-white" data-close>닫기</button></div></div><div id="toast" class="toast">복사되었습니다!</div>
</main><script>
const fruits=[['사과','🍎','감사의 열매','올해를 돌아보며 가장 감사했던 일은 무엇인가요?','bg-rose-500'],['포도','🍇','기쁨의 열매','올해 나에게 가장 큰 기쁨을 준 순간은 언제였나요?','bg-purple-500'],['복숭아','🍑','사랑의 열매','올해 누군가에게 받았던 사랑 중 기억에 남는 순간은 무엇인가요?','bg-pink-400'],['귤','🍊','성장의 열매','올해의 나를 돌아봤을 때, 가장 성장했다고 느끼는 부분은 무엇인가요?','bg-amber-500'],['딸기','🍓','소망의 열매','앞으로 꼭 이루어가고 싶은 소망은 무엇인가요?','bg-rose-500']];let current,muted=false;const $=id=>document.getElementById(id);function screen(id){['home','loading','result','done'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function render(){let [n,i,b,q,c]=current;['name','mname'].forEach(x=>$(x).textContent=n);['icon','micon'].forEach(x=>$(x).textContent=i);['question','mquestion'].forEach(x=>$(x).textContent=q);['badge','mbadge'].forEach(x=>{$(x).textContent=b;$(x).className='px-4 py-1 rounded-full text-white '+c})}function beep(){if(!muted)try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=600;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}}function draw(){beep();screen('loading');$('progress').style.width='100%';current=fruits[Math.floor(Math.random()*fruits.length)];setTimeout(()=>{render();screen('result');$('card').classList.remove('flip');setTimeout(()=>$('card').classList.add('flip'),80)},2400)}$('draw').onclick=draw;$('again').onclick=draw;$('homeBtn').onclick=()=>screen('home');$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};$('share').onclick=()=>{$('shareModal').classList.remove('hidden');render()};$('copy').onclick=()=>{let[n,,b,q]=current;navigator.clipboard?.writeText(`[오늘의 한 해 열매 카드]\n열매: ${n} (${b})\n질문: ${q}`).then(()=>toast('카드 내용이 복사되었습니다!'))};$('finish').onclick=()=>{$('shareModal').classList.add('hidden');screen('done')};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.modal').classList.add('hidden'));$('gallery').onclick=()=>{$('list').innerHTML=fruits.map(([n,i,b,q,c])=>`<div class="flex gap-3 items-center p-3 rounded-xl bg-pink-50"><span class="text-3xl">${i}</span><div><b>${n} · ${b}</b><p class="text-xs text-gray-600">${q}</p></div></div>`).join('');$('galleryModal').classList.remove('hidden')};screen('home');
</script></body></html>
